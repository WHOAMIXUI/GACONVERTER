<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alat PDF dan File</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#e9eef5;--panel:#fff;--ink:#14213d;--mute:#5a6785;--line:#c9d3e3;--blue:#2b4eff;--blue-ink:#fff;--sig:#ffd23f;--ok:#0b7a4b;--err:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1629;--panel:#18213b;--ink:#eef2fb;--mute:#9aa7c7;--line:#2c3961;--blue:#6f8aff;--blue-ink:#0f1629;--ok:#4ade9a;--err:#ff8a7a}}
:root[data-theme="dark"]{--bg:#0f1629;--panel:#18213b;--ink:#eef2fb;--mute:#9aa7c7;--line:#2c3961;--blue:#6f8aff;--blue-ink:#0f1629;--ok:#4ade9a;--err:#ff8a7a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:32px 18px 64px}
h1{font-size:clamp(2.1rem,6.5vw,3.4rem);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 10px}
h1 span{background:var(--sig);color:#14213d;padding:0 .18em;border-radius:6px}
h2{font-size:1.7rem;letter-spacing:-.02em;margin:18px 0 4px}
.lead{color:var(--mute);margin:0 0 22px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:block;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.card:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.g{width:44px;height:44px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:800;margin-bottom:10px}
.card b{display:block;font-size:1.05rem}
.card small{color:var(--mute);display:block;line-height:1.35;margin-top:2px}
button,select,input[type=text],input[type=number]{font:inherit;color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--blue);color:var(--blue-ink)}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
button.sm{padding:4px 10px}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
#drop{display:block;border:2.5px dashed var(--c);border-radius:18px;background:var(--panel);padding:34px 16px;text-align:center;cursor:pointer;margin-top:14px}
#drop.over{background:color-mix(in srgb,var(--sig) 35%,var(--panel))}
#drop b{font-size:1.15rem;display:block}
#drop small{color:var(--mute)}
#pick{position:absolute;opacity:0;pointer-events:none}
#drop:focus-within{outline:3px solid var(--c);outline-offset:3px}
.row{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:8px}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0}
.opts label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
.act{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px}
#msg{color:var(--mute)}#msg.err{color:var(--err)}
.note{color:var(--mute);font-size:.9rem;margin:6px 0 0}
.res .row{border-color:var(--ok)}
footer{margin-top:30px;color:var(--mute);font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Semua alat PDF <span>satu tempat</span></h1>
<p class="lead">Gabung, pisah, kompres, putar, dan ubah file. Semua berjalan di browser kamu, jadi file tidak diunggah ke server mana pun.</p>

<section id="home"><div class="grid" id="grid"></div>
<footer>Belum didukung: proteksi atau buka kunci PDF, konversi Word atau PowerPoint, serta video dan audio.</footer></section>

<section id="tool" hidden>
<button class="ghost" id="back">← Semua alat</button>
<h2 id="tt"></h2><p class="lead" id="td" style="margin-bottom:0"></p>
<p class="note" id="tn"></p>
<label id="drop" for="pick"><b>Pilih file atau seret ke sini</b><small id="hint"></small></label>
<input type="file" id="pick">
<div id="files"></div>
<div class="opts" id="opts"></div>
<div class="act"><button id="go">Proses</button><span id="msg"></span></div>
<div class="res" id="res"></div>
</section>
</main>
<script>
const pl=PDFLib,$=s=>document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=n=>n.replace(/\.[^.]+$/,''),ext=n=>(n.split('.').pop()||'').toLowerCase();
const sz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const msg=(t,e)=>{const m=$('#msg');m.textContent=t;m.className=e?'err':''};
const pdfBlob=async d=>new Blob([await d.save()],{type:'application/pdf'});
const ld=async f=>pl.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});
const tb=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
function rng(s,n){const o=[];for(const p of String(s).split(',')){const m=p.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)continue;let a=+m[1],b=+(m[2]||m[1]);if(a>b)[a,b]=[b,a];for(let i=Math.max(a,1);i<=Math.min(b,n);i++)if(!o.includes(i-1))o.push(i-1)}
 if(!o.length)throw new Error('Rentang halaman tidak valid. Contoh: 1-3, 5');return o}
const pjs=async f=>pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
async function raster(pdf,i,s){const p=await pdf.getPage(i),v=p.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:v}).promise;return c}
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>no(new Error(f.name+' bukan gambar yang valid.'));im.src=u});
const flat=async(f)=>{const im=await loadImg(f),c=document.createElement('canvas');c.width=im.naturalWidth||800;c.height=im.naturalHeight||600;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c};

const ops={
async merge(fs){const out=await pl.PDFDocument.create();for(const f of fs){const s=await ld(f);(await out.copyPages(s,s.getPageIndices())).forEach(p=>out.addPage(p))}return[{name:'gabungan.pdf',blob:await pdfBlob(out)}]},
async split(fs,o){const f=fs[0],s=await ld(f),n=s.getPageCount(),r=[];
 if(o.mode==='Satu file per halaman'){for(let i=0;i<n;i++){const d=await pl.PDFDocument.create();d.addPage((await d.copyPages(s,[i]))[0]);r.push({name:`${base(f.name)}-hal${i+1}.pdf`,blob:await pdfBlob(d)})}return r}
 const d=await pl.PDFDocument.create();(await d.copyPages(s,rng(o.range,n))).forEach(p=>d.addPage(p));return[{name:base(f.name)+'-potongan.pdf',blob:await pdfBlob(d)}]},
async remove(fs,o){const f=fs[0],d=await ld(f),n=d.getPageCount(),x=rng(o.range,n).sort((a,b)=>b-a);if(x.length>=n)throw new Error('Tidak boleh menghapus semua halaman.');x.forEach(i=>d.removePage(i));return[{name:base(f.name)+'-edit.pdf',blob:await pdfBlob(d)}]},
async rotate(fs,o){const f=fs[0],d=await ld(f),a=+o.deg;d.getPages().forEach(p=>p.setRotation(pl.degrees((p.getRotation().angle+a)%360)));return[{name:base(f.name)+'-putar.pdf',blob:await pdfBlob(d)}]},
async compress(fs,o){const f=fs[0],q={Rendah:[1,.45],Sedang:[1.4,.65],Tinggi:[2,.82]}[o.q],pdf=await pjs(f),out=await pl.PDFDocument.create();
 for(let i=1;i<=pdf.numPages;i++){msg(`Halaman ${i} dari ${pdf.numPages}…`);const v=(await pdf.getPage(i)).getViewport({scale:1}),c=await raster(pdf,i,q[0]*1.5),im=await out.embedJpg(await(await tb(c,'image/jpeg',q[1])).arrayBuffer());out.addPage([v.width,v.height]).drawImage(im,{x:0,y:0,width:v.width,height:v.height})}
 const b=await pdfBlob(out);return[{name:base(f.name)+'-kompres.pdf',blob:b,note:`${sz(f.size)} → ${sz(b.size)}`+(b.size>=f.size?' (tidak lebih kecil, coba kualitas Rendah)':'')}]},
async pdf2jpg(fs){const f=fs[0],pdf=await pjs(f),r=[];for(let i=1;i<=pdf.numPages;i++){msg(`Halaman ${i} dari ${pdf.numPages}…`);r.push({name:`${base(f.name)}-hal${i}.jpg`,blob:await tb(await raster(pdf,i,2),'image/jpeg',.9)})}return r},
async jpg2pdf(fs,o){const d=await pl.PDFDocument.create();for(const f of fs){const c=await flat(f),im=await d.embedJpg(await(await tb(c,'image/jpeg',.9)).arrayBuffer()),w=c.width,h=c.height;
 if(o.size==='A4'){const pg=d.addPage([595,842]),k=Math.min(555/w,802/h);pg.drawImage(im,{x:(595-w*k)/2,y:(842-h*k)/2,width:w*k,height:h*k})}
 else d.addPage([w,h]).drawImage(im,{x:0,y:0,width:w,height:h})}return[{name:'gambar.pdf',blob:await pdfBlob(d)}]},
async pagenum(fs,o){const f=fs[0],d=await ld(f),ft=await d.embedFont(pl.StandardFonts.Helvetica),ps=d.getPages();ps.forEach((p,i)=>{const t=o.fmt==='1 / N'?`${i+1} / ${ps.length}`:String(i+1),w=ft.widthOfTextAtSize(t,11),W=p.getWidth();p.drawText(t,{x:o.pos==='Kanan'?W-36-w:(W-w)/2,y:20,size:11,font:ft,color:pl.rgb(.2,.2,.2)})});return[{name:base(f.name)+'-nomor.pdf',blob:await pdfBlob(d)}]},
async watermark(fs,o){const f=fs[0],d=await ld(f),ft=await d.embedFont(pl.StandardFonts.HelveticaBold),t=o.text||'RAHASIA';if(/[^\x20-\x7e]/.test(t))throw new Error('Watermark hanya mendukung huruf latin dan angka biasa.');
 d.getPages().forEach(p=>{const{width:W,height:H}=p.getSize(),s=Math.min(70,W*1.1/Math.max(t.length,4)*1.2),w=ft.widthOfTextAtSize(t,s),k=Math.SQRT1_2;p.drawText(t,{x:W/2-w/2*k+s*.35*k,y:H/2-w/2*k-s*.35*k,size:s,font:ft,color:pl.rgb(.5,.5,.5),opacity:+o.op,rotate:pl.degrees(45)})});return[{name:base(f.name)+'-watermark.pdf',blob:await pdfBlob(d)}]},
async convert(fs,o){const r=[],OUT={img:['png','jpg','webp','pdf'],data:['xlsx','csv','tsv','json','html'],txt:['txt','html','pdf']},to=o.to;
 for(const f of fs){const e=ext(f.name),k=['png','jpg','jpeg','webp','bmp','gif','svg','avif'].includes(e)?'img':['xlsx','xls','csv','tsv','json','ods'].includes(e)?'data':['txt','md','html','htm','log'].includes(e)?'txt':null;
  if(!k||!OUT[k].includes(to)||e===to){msg(`${f.name}: tidak bisa diubah ke ${to}.`,1);continue}
  let b;
  if(k==='img'){const c=await flat(f);if(to==='pdf'){const d=await pl.PDFDocument.create(),im=await d.embedJpg(await(await tb(c,'image/jpeg',.9)).arrayBuffer());d.addPage([c.width,c.height]).drawImage(im,{x:0,y:0,width:c.width,height:c.height});b=await pdfBlob(d)}else b=await tb(c,{png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[to],.92)}
  else if(k==='data'){let wb;if(e==='json'){let j=JSON.parse(await f.text());if(!Array.isArray(j))j=[j];wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(j),'Sheet1')}else wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];
   b=to==='xlsx'?new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]):new Blob([to==='csv'?'\ufeff'+XLSX.utils.sheet_to_csv(ws):to==='tsv'?XLSX.utils.sheet_to_csv(ws,{FS:'\t'}):to==='json'?JSON.stringify(XLSX.utils.sheet_to_json(ws),null,2):XLSX.utils.sheet_to_html(ws)])}
  else{const raw=await f.text(),h=e==='html'||e==='htm',pt=h?(new DOMParser().parseFromString(raw,'text/html').body.textContent||''):raw;
   if(to==='txt')b=new Blob([pt]);else if(to==='html')b=new Blob([h?raw:'<!DOCTYPE html><meta charset="utf-8"><pre style="white-space:pre-wrap">'+esc(raw)+'</pre>']);
   else{const d=await pl.PDFDocument.create(),ft=await d.embedFont(pl.StandardFonts.Helvetica);let pg=d.addPage([595,842]),y=800;
    for(const ln of pt.replace(/[^\x09\x0a\x20-\x7e]/g,'?').split('\n')){let cur='';const out=[];for(const w of ln.split(' ')){const t=cur?cur+' '+w:w;if(ft.widthOfTextAtSize(t,11)>515&&cur){out.push(cur);cur=w}else cur=t}out.push(cur);
     for(const l of out){if(y<50){pg=d.addPage([595,842]);y=800}pg.drawText(l,{x:40,y,size:11,font:ft});y-=15}}b=await pdfBlob(d)}}
  r.push({name:base(f.name)+'.'+to,blob:b})}
 return r}
};
const PDF='.pdf';
const T=[
{id:'merge',n:'Gabung PDF',d:'Satukan beberapa PDF menjadi satu file.',g:'⧉',c:'#e5322d',acc:PDF,multi:1,min:2},
{id:'split',n:'Pisah PDF',d:'Ambil halaman tertentu atau pecah per halaman.',g:'✂',c:'#e07b00',acc:PDF,o:[{k:'mode',l:'Mode',s:['Ambil rentang halaman','Satu file per halaman']},{k:'range',l:'Rentang (mode pertama)',t:'1-3, 5'}]},
{id:'remove',n:'Hapus halaman',d:'Buang halaman yang tidak diperlukan.',g:'✕',c:'#c2185b',acc:PDF,o:[{k:'range',l:'Halaman yang dihapus',t:'2, 4-6'}]},
{id:'rotate',n:'Putar PDF',d:'Putar semua halaman 90°, 180°, atau 270°.',g:'↻',c:'#7b3fe4',acc:PDF,o:[{k:'deg',l:'Putar searah jarum jam',s:['90','180','270']}]},
{id:'compress',n:'Kompres PDF',d:'Perkecil ukuran file PDF.',g:'⇩',c:'#0b8f5a',acc:PDF,note:'Halaman diubah menjadi gambar, jadi teks tidak bisa diseleksi lagi di hasilnya.',o:[{k:'q',l:'Kualitas',s:['Sedang','Rendah','Tinggi']}]},
{id:'jpg2pdf',n:'JPG ke PDF',d:'Ubah gambar menjadi PDF, urutan bisa diatur.',g:'▣',c:'#d4a000',acc:'image/*',multi:1,o:[{k:'size',l:'Ukuran halaman',s:['Sesuai gambar','A4']}]},
{id:'pdf2jpg',n:'PDF ke JPG',d:'Ubah setiap halaman PDF menjadi gambar.',g:'▤',c:'#1d7de0',acc:PDF},
{id:'pagenum',n:'Nomor halaman',d:'Tambahkan nomor di bawah setiap halaman.',g:'#',c:'#00838f',acc:PDF,o:[{k:'pos',l:'Posisi',s:['Tengah','Kanan']},{k:'fmt',l:'Format',s:['1','1 / N']}]},
{id:'watermark',n:'Watermark',d:'Beri teks watermark miring di semua halaman.',g:'✎',c:'#5d4037',acc:PDF,o:[{k:'text',l:'Teks',t:'RAHASIA'},{k:'op',l:'Kepekatan',s:['0.15','0.3','0.5']}]},
{id:'convert',n:'Konversi file lain',d:'Gambar, spreadsheet, JSON, dan teks ke format lain.',g:'⇄',c:'#2b4eff',acc:'',multi:1,note:'Gambar: PNG JPG WEBP PDF. Data (XLSX XLS CSV TSV JSON ODS): XLSX CSV TSV JSON HTML. Teks (TXT MD HTML): TXT HTML PDF.',o:[{k:'to',l:'Ubah ke',s:['png','jpg','webp','pdf','xlsx','csv','tsv','json','html','txt']}]}
];
$('#grid').innerHTML=T.map(t=>`<button class="card" style="--c:${t.c}" data-t="${t.id}"><div class="g">${t.g}</div><b>${t.n}</b><small>${t.d}</small></button>`).join('');

let cur=null,files=[],res=[];
function show(id){
  cur=T.find(t=>t.id===id);$('#home').hidden=!!cur;$('#tool').hidden=!cur;files=[];res=[];
  if(!cur){try{history.replaceState(null,'',location.pathname)}catch(e){}return}
  try{location.hash=id}catch(e){}
  $('#tool').style.setProperty('--c',cur.c);$('#tt').textContent=cur.n;$('#td').textContent=cur.d;$('#tn').textContent=cur.note||'';
  $('#pick').accept=cur.acc;$('#pick').multiple=!!cur.multi;
  $('#hint').textContent=cur.multi?'Bisa lebih dari satu file':'Satu file';
  $('#opts').innerHTML=(cur.o||[]).map(o=>`<label>${o.l}${o.s?`<select data-k="${o.k}">${o.s.map(v=>`<option>${v}</option>`).join('')}</select>`:`<input type="text" data-k="${o.k}" value="${esc(o.t)}">`}</label>`).join('');
  msg('');draw();window.scrollTo(0,0)
}
function draw(){
  $('#files').innerHTML=files.map((f,i)=>`<div class="row" data-i="${i}"><span>${esc(f.name)} <small>${sz(f.size)}</small></span>${cur.multi?`<button class="ghost sm" data-up aria-label="Naik">↑</button><button class="ghost sm" data-dn aria-label="Turun">↓</button>`:''}<button class="ghost sm" data-rm aria-label="Hapus">✕</button></div>`).join('');
  $('#res').innerHTML=res.length?(res.length>1?'<div class="act"><button id="zip">Unduh semua (ZIP)</button></div>':'')+res.map((r,i)=>`<div class="row" data-r="${i}"><span>${esc(r.name)} <small>${sz(r.blob.size)}${r.note?' · '+esc(r.note):''}</small></span><button class="sm" data-dl>Unduh</button></div>`).join(''):'';
  $('#go').disabled=!files.length;
}
function addFiles(list){
  let a=[...list];
  if(cur.acc==='.pdf')a=a.filter(f=>ext(f.name)==='pdf');else if(cur.acc==='image/*')a=a.filter(f=>f.type.startsWith('image/'));
  if(!a.length){msg('Tipe file tidak sesuai untuk alat ini.',1);return}
  files=cur.multi?files.concat(a):[a[0]];res=[];msg('');draw()
}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#grid').onclick=e=>{const c=e.target.closest('[data-t]');if(c)show(c.dataset.t)};
$('#back').onclick=()=>show(null);
$('#pick').onchange=e=>{addFiles(e.target.files);e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('#files').onclick=e=>{const r=e.target.closest('.row');if(!r)return;const i=+r.dataset.i;
  if(e.target.matches('[data-rm]'))files.splice(i,1);
  else if(e.target.matches('[data-up]')&&i>0)[files[i-1],files[i]]=[files[i],files[i-1]];
  else if(e.target.matches('[data-dn]')&&i<files.length-1)[files[i+1],files[i]]=[files[i],files[i+1]];
  res=[];draw()};
$('#res').onclick=async e=>{
  if(e.target.matches('[data-dl]')){const r=res[+e.target.closest('.row').dataset.r];save(r.blob,r.name)}
  if(e.target.id==='zip'){const z=new JSZip();res.forEach(r=>z.file(r.name,r.blob));save(await z.generateAsync({type:'blob'}),'hasil.zip')}};
$('#go').onclick=async()=>{
  if(cur.min&&files.length<cur.min){msg(`Pilih minimal ${cur.min} file.`,1);return}
  const o={};document.querySelectorAll('#opts [data-k]').forEach(el=>o[el.dataset.k]=el.value);
  $('#go').disabled=true;msg('Memproses…');res=[];draw();
  try{res=await ops[cur.id](files,o);msg(res.length?'Selesai.':'Tidak ada file yang dihasilkan.',!res.length)}
  catch(err){msg('Gagal: '+err.message,1)}
  draw()};
if(location.hash.length>1)show(location.hash.slice(1));
</script>
</body>
</html>
